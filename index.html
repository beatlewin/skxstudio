<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skx studios | Portfolio & Comics</title>
    <meta name="description" content="Официальный сайт skx studios. Комиксы Crystal of Life Beginning, соцсети и друзья.">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-orange: #f58631;
            --primary-orange-hover: #e07120;
            --bg-base: #0f1115;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --card-hover-transform: translateY(-6px);
        }

        [data-theme="light"] {
            --bg-base: #eef2f5;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --text-main: #1f2937;
            --text-muted: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(245, 134, 49, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(245, 134, 49, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 16px;
        }

        /* Header Layout */
        header {
            width: 90%;
            max-width: 1200px;
            margin: 20px 0;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-orange);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: lowercase;
        }

        .controls-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-control {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-control:hover {
            border-color: var(--primary-orange);
            color: var(--primary-orange);
        }

        select.btn-control {
            outline: none;
            appearance: none;
            padding-right: 28px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f58631' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
        }

        select.btn-control option {
            background: var(--bg-base);
            color: var(--text-main);
        }

        /* Main Content Container */
        main {
            width: 90%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 50px;
            margin-bottom: 60px;
        }

        section {
            padding: 35px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            border-left: 4px solid var(--primary-orange);
            padding-left: 12px;
        }

        .section-subtitle {
            font-size: 1.3rem;
            color: var(--primary-orange);
            font-weight: 600;
        }

        /* Comics Grid */
        .comics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .comic-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .comic-card:hover {
            transform: var(--card-hover-transform);
            border-color: var(--primary-orange);
        }

        .comic-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .comic-lang-tag {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Socials Grid */
        .socials-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .social-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-link i {
            font-size: 2rem;
            color: var(--primary-orange);
        }

        .social-link:hover {
            transform: var(--card-hover-transform);
            color: var(--primary-orange);
        }

        /* Friends / Animated Slider Section Styling */
        .friends-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .animated-banner-link {
            display: block;
            width: 100%;
            max-width: 700px;
            aspect-ratio: 16 / 7;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-decoration: none;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .animated-banner-link:hover {
            transform: var(--card-hover-transform);
            border-color: var(--primary-orange);
        }

        .animated-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .animated-slide.active {
            opacity: 1;
        }

        /* Responsive Breakpoints */
        @media (max-width: 900px) {
            .comics-grid {
                grid-template-columns: repeat(1, 1fr);
            }
            .socials-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            .socials-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
<body>

    <script>
        // --- Локализация (Перевод интерфейса) ---
        const translations = {
            ru: {
                comicsTitle: "наши комиксы",
                langSk: "Словацкий перевод",
                langRu: "Оригинал русский",
                langEn: "Английский перевод",
                socialsTitle: "наши соцсети",
                friendsTitle: "Наши друзья"
            },
            en: {
                comicsTitle: "our comics",
                langSk: "Slovak translation",
                langRu: "Russian original",
                langEn: "English translation",
                socialsTitle: "our social media",
                friendsTitle: "Our friends"
            },
            sk: {
                comicsTitle: "naše komiksy",
                langSk: "Slovenský preklad",
                langRu: "Ruský originál",
                langEn: "Anglický preklad",
                socialsTitle: "naše sociálne siete",
                friendsTitle: "Naši priatelia"
            }
        };

        const langSelect = document.getElementById('langSelect');
        
        function changeLanguage(lang) {
            const dictionary = translations[lang] || translations.ru;
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (dictionary[key]) {
                    element.textContent = dictionary[key];
                }
            });
            document.documentElement.lang = lang;
        }

        langSelect.addEventListener('change', (e) => {
            changeLanguage(e.target.value);
        });

        // --- Переключение Темы ---
        const themeToggleBtn = document.getElementById('themeToggle');
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            themeToggleBtn.innerHTML = newTheme === 'dark' 
                ? '<i class="fa-solid fa-moon"></i>' 
                : '<i class="fa-solid fa-sun"></i>';
        });

        // --- Логика анимированного слайдера и динамической смены ссылок ---
        const slides = document.querySelectorAll('.animated-slide');
        const bannerLink = document.getElementById('animatedBannerLink');
        let currentIndex = 0;

        function switchSlide() {
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            const activeSlide = slides[currentIndex];
            activeSlide.classList.add('active');
            
            // Динамически меняем ссылку в зависимости от текущей отображаемой картинки
            bannerLink.href = activeSlide.getAttribute('data-url');
        }

        // Переключение картинок каждые 4 секунды
        setInterval(switchSlide, 4000);
    </script>
</body>
