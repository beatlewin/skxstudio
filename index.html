    <style>
        :root {
            --primary-orange: #f58631;
            --primary-orange-hover: #e07120;
            --bg-base: #0f1115;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger-color: #ef4444;
            --card-hover-transform: translateY(-6px);
        }

        [data-theme="light"] {
            --bg-base: #eef2f5;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --text-main: #1f2937;
            --text-muted: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(245, 134, 49, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(245, 134, 49, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 16px;
        }

        /* Header Layout */
        header {
            width: 90%;
            max-width: 1200px;
            margin: 20px 0;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-orange);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: lowercase;
        }

        .controls-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-control {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-control:hover {
            border-color: var(--primary-orange);
            color: var(--primary-orange);
        }

        select.btn-control {
            outline: none;
            appearance: none;
            padding-right: 28px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f58631' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
        }

        select.btn-control option {
            background: var(--bg-base);
            color: var(--text-main);
        }

        /* Main Content Container */
        main {
            width: 90%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 50px;
            margin-bottom: 60px;
        }

        section {
            padding: 35px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            border-left: 4px solid var(--primary-orange);
            padding-left: 12px;
        }

        .section-subtitle {
            font-size: 1.3rem;
            color: var(--primary-orange);
            font-weight: 600;
        }

        /* Comics Grid */
        .comics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .comic-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .comic-card:hover {
            transform: var(--card-hover-transform);
            border-color: var(--primary-orange);
        }

        .comic-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .comic-lang-tag {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Socials Grid */
        .socials-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .social-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-link i {
            font-size: 2rem;
            color: var(--primary-orange);
        }

        .social-link:hover {
            transform: var(--card-hover-transform);
            color: var(--primary-orange);
        }

        /* Summary Rating Score Card */
        .rating-summary-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
        }

            font-size: 2.8rem;
            font-weight: 700;
